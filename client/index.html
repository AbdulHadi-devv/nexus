<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus — Turn problems into ideas, solutions, and actionable MVPs." />
    <title>Nexus — AI Product Builder</title>

    <!-- ============================================================ -->
    <!-- NEXUS FIRST-PAINT PRELOADER                                   -->
    <!-- ============================================================ -->
    <!-- 150ms delay → 1.4s snake animation → freeze at completed N.   -->
    <!-- Fades out only after the snake finishes AND React mounts.     -->
    <!-- ============================================================ -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0b14;
      }

      body.nexus-loading {
        overflow: hidden;
      }

      #nexus-preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0b0b14;
        opacity: 1;
        transition: opacity 0.4s ease;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      }

      #nexus-preloader.exiting {
        opacity: 0;
        pointer-events: none;
      }

      .nexus-pre-tile {
        position: relative;
        width: 128px;
        height: 128px;
      }

      .nexus-pre-tile-inner {
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        box-shadow:
          0 20px 60px rgba(99, 102, 241, 0.45),
          0 8px 24px rgba(168, 85, 247, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: nexusPreTilePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .nexus-pre-tile-inner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 25%,
          rgba(255, 255, 255, 0.35),
          transparent 55%
        );
      }

      .nexus-pre-glow {
        position: absolute;
        inset: -20%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.55) 0%,
          rgba(139, 92, 246, 0) 65%
        );
        filter: blur(14px);
        animation: nexusPreGlow 1.8s ease-in-out infinite;
      }

      .nexus-pre-svg {
        position: relative;
        width: 80%;
        height: 80%;
        z-index: 1;
        overflow: visible;
      }

      /* Snake: 150ms delay, 1.4s duration, ends frozen at dashoffset 0 */
      .nexus-pre-snake {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: nexusPreSnake 1.4s cubic-bezier(0.4, 0, 0.6, 1) 0.15s forwards;
        will-change: stroke-dashoffset;
      }

      .nexus-pre-label {
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 6px;
        color: #e5e7eb;
        text-indent: 6px;
        animation: nexusPreFade 0.7s ease-out 0.45s both;
      }

      .nexus-pre-sub {
        font-weight: 500;
        font-size: 0.75rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #94a3b8;
        animation: nexusPreFade 0.7s ease-out 0.6s both;
      }

      @keyframes nexusPreTilePop {
        0%   { transform: scale(0.85); opacity: 0; }
        60%  { transform: scale(1.04); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes nexusPreGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.08); }
      }

      /* Piecewise snake: burst → slow → burst (11 stops) */
      @keyframes nexusPreSnake {
        0%   { stroke-dashoffset: 200; }
        5%   { stroke-dashoffset: 187; }
        10%  { stroke-dashoffset: 168; }
        18%  { stroke-dashoffset: 140; }
        30%  { stroke-dashoffset: 128; }
        50%  { stroke-dashoffset: 100; }
        70%  { stroke-dashoffset: 76; }
        82%  { stroke-dashoffset: 62; }
        90%  { stroke-dashoffset: 40; }
        95%  { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes nexusPreFade {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .nexus-pre-tile-inner,
        .nexus-pre-glow,
        .nexus-pre-snake,
        .nexus-pre-label,
        .nexus-pre-sub {
          animation: none !important;
        }
        .nexus-pre-snake { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body class="nexus-loading">
    <div id="nexus-preloader" aria-label="Loading Nexus">
      <div class="nexus-pre-tile">
        <div class="nexus-pre-glow"></div>
        <div class="nexus-pre-tile-inner">
          <svg class="nexus-pre-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="nexus-pre-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.8" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <path
              d="M 25 80 L 25 20 L 75 80 L 75 20"
              fill="none"
              stroke="rgba(255,255,255,0.15)"
              stroke-width="9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              class="nexus-pre-snake"
              d="M 25 80 L 25 20 L 75 80 L 75 20"
              fill="none"
              stroke="#ffffff"
              stroke-width="9"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#nexus-pre-glow-filter)"
            />
          </svg>
        </div>
      </div>

      <div class="nexus-pre-label">NEXUS</div>
      <div class="nexus-pre-sub">Loading experience…</div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        var pre = document.getElementById('nexus-preloader');
        if (!pre) return;

        // Snake delay (150ms) + duration (1400ms) + small buffer = 1600ms
        var MIN_DISPLAY_MS = 1600;
        var startTime = Date.now();
        var snakeDone = false;
        var reactMounted = false;
        var fadeStarted = false;

        function unlockScroll() {
          document.body.classList.remove('nexus-loading');
        }

        function tryFadeOut() {
          if (fadeStarted) return;
          if (!snakeDone || !reactMounted) return;

          var elapsed = Date.now() - startTime;
          var wait = Math.max(0, MIN_DISPLAY_MS - elapsed);

          fadeStarted = true;
          setTimeout(function () {
            pre.classList.add('exiting');
            unlockScroll();
            setTimeout(function () {
              if (pre.parentNode) pre.parentNode.removeChild(pre);
            }, 450);
          }, wait);
        }

        var snake = pre.querySelector('.nexus-pre-snake');
        if (snake) {
          // Delay + duration = ~1550ms from start
          snake.addEventListener('animationend', function () {
            snakeDone = true;
            tryFadeOut();
          });
          // Safety in case animationend never fires
          setTimeout(function () {
            if (!snakeDone) {
              snakeDone = true;
              tryFadeOut();
            }
          }, 2200);
        } else {
          snakeDone = true;
        }

        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            observer.disconnect();
            reactMounted = true;
            tryFadeOut();
          }
        });
        observer.observe(document.getElementById('root') || document.body, {
          childList: true,
          subtree: true,
        });

        // Absolute safety net
        setTimeout(function () {
          if (pre.parentNode) {
            pre.classList.add('exiting');
            unlockScroll();
            setTimeout(function () {
              if (pre.parentNode) pre.parentNode.removeChild(pre);
            }, 450);
          }
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
